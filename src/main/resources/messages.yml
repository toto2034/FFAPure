# Global messages. Supported colors:
# - legacy: &a &c &7
# - split hex: &x&1&3&5&8&0&0
# - compact hex: &#135800
#
# Supported internal placeholders include:
# {player} {mode} {mode_display} {kills} {deaths} {kdr}
# {streak} {best_streak} {selected_kit} {kit} {ffa_players} {world}
# You can also use {ffa_players_<mode>} like {ffa_players_crystal}.

prefix: '&#d69900[FFA] &r'
no-permission: '{prefix}&cNon hai il permesso.'
player-only: '{prefix}&cSolo i giocatori possono usare questo comando.'
mode-not-found: '{prefix}&cModalita non trovata.'
mode-no-spawn: '{prefix}&cQuesta modalita non ha uno spawn FFA configurato.'
not-in-mode: '{prefix}&cNon sei in nessuna modalita FFA.'
current-mode: '{prefix}&7Modalita attuale: &f{mode_display}'
joined-mode: '{prefix}&aSei entrato nella modalita &f{mode_display}&a.'
left-mode: '{prefix}&eHai lasciato la modalita &f{mode_display}&e.'
teleported-spawn: '{prefix}&aTeletrasportato allo spawn FFA di &f{mode_display}&a.'
spawn-set: '{prefix}&aSpawn FFA impostato per &f{mode}&a.'
lobby-set: '{prefix}&aLobby impostata per &f{mode}&a.'
mode-created: '{prefix}&aModalita &f{mode}&a creata.'
mode-deleted: '{prefix}&eModalita &f{mode}&e eliminata.'
mode-already-exists: '{prefix}&cEsiste gia una modalita con id &f{mode}&c.'
mode-delete-failed: '{prefix}&cNon e stato possibile eliminare la modalita &f{mode}&c.'
mode-create-failed: '{prefix}&cNon e stato possibile creare la modalita &f{mode}&c.'
mode-create-blocked-world: '{prefix}&cNel mondo spawn/hub non puoi creare modalita. Da qui e consentito solo /ffa join <mode>.'
mode-removed-player: '{prefix}&eLa modalita &f{mode_display}&e e stata rimossa. Sei stato fatto uscire in sicurezza.'
reload-complete: '{prefix}&aPlugin ricaricato con successo.'
reload-gui-closed: '{prefix}&eLe GUI FFA aperte sono state chiuse per applicare il reload.'
blocked-command: '{prefix}&cComando bloccato in FFA.'
kit-mode-required: '{prefix}&cUsa /kit dentro un mondo FFA oppure /kit <mode>.'
ffa-command-only-in-ffa: '{prefix}&cQuesto comando FFA funziona solo nei mondi FFA. Usa /ffa join <mode> da un mondo normale.'
layout-empty: '{prefix}&eQuesto layout e vuoto.'
layout-saved: '{prefix}&aLayout salvato.'
layout-imported: '{prefix}&aInventario importato nell editor kit.'
layout-loaded: '{prefix}&aLayout caricato: &f{kit}&a.'
layout-editor-missing: '{prefix}&cEditor non trovato. Riapri il menu.'
editor-clear-cursor-first: '{prefix}&eRimetti prima l item che hai sul cursore.'
premade-loaded: '{prefix}&aPremade kit caricato: &f{premade}&a.'
premade-empty: '{prefix}&cIl premade kit della modalita corrente e vuoto o configurato male.'
premium-kit-locked: '{prefix}&cDevi avere il permesso VIP per usare &f{kit}&c.'
inventory-cleared: '{prefix}&eInventario pulito.'
feature-coming-soon: '{prefix}&eQuesta funzione non e ancora disponibile.'
kill-message: '{prefix}&6{player} &7ha eliminato un avversario. Streak: &f{streak}'
killstreak-message: '{prefix}&6{player} &esta dominando in &f{mode_display}&e con streak &c{streak}&e.'
modes-header: '{prefix}&6Modalita disponibili:'
mode-entry: '{prefix}&7- &f{mode_display} &8(&7{mode}&8) &7Players: &f{ffa_players_mode}'
stats-header: '{prefix}&6Statistiche per &f{mode_display}'
stats-kills: '{prefix}&7Kills: &f{kills}'
stats-deaths: '{prefix}&7Deaths: &f{deaths}'
stats-kdr: '{prefix}&7KDR: &f{kdr}'
stats-streak: '{prefix}&7Best Streak: &f{streak}'
debug-mode: '{prefix}&7World mode: &f{mode_display} &8(&7{mode}&8)'
player-not-found: '{prefix}&cGiocatore non trovato.'
invalid-slot: '{prefix}&cSlot non valido.'
invalid-mode-id: '{prefix}&cID modalita non valido. Usa solo lettere minuscole, numeri, - e _.'
internal-error: '{prefix}&cSi e verificato un errore interno. Controlla la console.'
usage-join: '{prefix}&eUsa /ffa join <mode>'
usage-spawn: '{prefix}&eUsa /ffa spawn <mode>'
usage-setspawn: '{prefix}&eUsa /ffa setspawn <mode>'
usage-setlobby: '{prefix}&eUsa /ffa setlobby <mode>'
usage-createmode: '{prefix}&eUsa /ffa createmode <id>'
usage-deletemode: '{prefix}&eUsa /ffa deletemode <id>'
usage-openkiteditor: '{prefix}&eUsa /ffa openkiteditor <player> <mode> <slot>'
help-header: '{prefix}&6Comandi disponibili'
help-join: '{prefix}&e/ffa join <mode> &7- Entra nella modalita scelta'
help-spawn: '{prefix}&e/ffa spawn <mode> &7- Vai allo spawn FFA della modalita'
help-stats: '{prefix}&e/ffa stats [mode] &7- Mostra le statistiche della modalita'
help-modes: '{prefix}&e/ffa modes &7- Elenca le modalita disponibili'
help-kit-command: '{prefix}&e/kit [mode] &7- Apre GUI_KIT_BROWSER della modalita corrente o specificata'
help-admin: '{prefix}&cAdmin: /ffa reload, setspawn, setlobby, createmode, deletemode, openkiteditor, debugmode'
